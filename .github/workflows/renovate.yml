name: Renovate

# Self-hosted Renovate: no Mend app, account, or license key. Reads its config
# from .github/renovate.json5 (base-image tags; github-actions is left to
# dependabot there).
#
# NOTE: pull_request events created with GITHUB_TOKEN do trigger PR workflows
# under GitHub's current rules, but the run starts in an approval-required
# state. Until a run is approved, a Renovate bump is still validated by the
# push-to-main build after merge; a bad base-tag bump fails that build loudly
# while bootc keeps the previous deployment. Fully unattended Renovate PR
# validation would need a GitHub App token or PAT instead of GITHUB_TOKEN.
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

concurrency:
  group: renovate

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
