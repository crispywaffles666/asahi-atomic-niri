name: Build asahi-atomic-niri

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
  schedule:
    - cron: "00 03 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/crispywaffles666/asahi-atomic-niri

jobs:
  build:
    name: Build aarch64 bootc image
    # Package hooks fail under qemu-user, so build on Arm.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      # No id-token: signing uses the COSIGN_PRIVATE_KEY secret, not OIDC.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The Containerfile's FEDORA_RELEASE ARG is the single source of truth
      # for the release; the image tags below follow it automatically.
      - name: Compute date tag and Fedora release
        id: meta
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "release=$(grep -oP '^ARG FEDORA_RELEASE=\K[0-9]+' Containerfile)" >> "$GITHUB_OUTPUT"

      # Build, rechunk, and lint run on PRs too; only the publish tail is gated.
      - name: Build the image locally
        run: |
          podman build \
            --file Containerfile \
            --tag "localhost/asahi-atomic-niri:${{ steps.meta.outputs.release }}-${{ steps.meta.outputs.date }}" \
            .

      # Repackage the rootfs into content-defined layers so daily updates only
      # pull what changed. Command line follows ublue-os/image-template's
      # ostree-rechunk recipe verbatim, running the rpm-ostree shipped inside
      # the image itself.
      - name: Rechunk the image
        run: |
          GRAPHROOT="$(podman info --format '{{.Store.GraphRoot}}')"
          podman run --rm --pull=never --privileged \
            --mount=type=image,src="localhost/asahi-atomic-niri:${{ steps.meta.outputs.release }}-${{ steps.meta.outputs.date }}",target=/rpm-ostree \
            --mount=type=bind,src=${GRAPHROOT},target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree \
            "localhost/asahi-atomic-niri:${{ steps.meta.outputs.release }}-${{ steps.meta.outputs.date }}" \
            compose build-chunked-oci \
            --max-layers 127 \
            --format-version=2 \
            --bootc \
            --rootfs /rpm-ostree \
            --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]localhost/asahi-atomic-niri:${{ steps.meta.outputs.release }}-${{ steps.meta.outputs.date }}"

      # Revalidate bootc structural requirements after the transformation.
      - name: Lint the rechunked image
        run: |
          podman run --rm \
            "localhost/asahi-atomic-niri:${{ steps.meta.outputs.release }}-${{ steps.meta.outputs.date }}" \
            bootc container lint --fatal-warnings

      - name: Tag the registry aliases
        run: |
          for tag in "${{ steps.meta.outputs.release }}-${{ steps.meta.outputs.date }}" latest "${{ github.sha }}"; do
            podman tag \
              "localhost/asahi-atomic-niri:${{ steps.meta.outputs.release }}-${{ steps.meta.outputs.date }}" \
              "${{ env.IMAGE_NAME }}:${tag}"
          done

      # PRs stop here; only the default branch may publish.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          # Write to the docker config path: podman falls back to reading it,
          # and cosign reads nothing else.
          mkdir -p "$HOME/.docker"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" --password-stdin \
            --authfile "$HOME/.docker/config.json"

      - name: Push all tags
        id: push
        if: github.event_name != 'pull_request'
        run: |
          podman push --digestfile digest.txt \
            "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.release }}-${{ steps.meta.outputs.date }}"
          podman push "${{ env.IMAGE_NAME }}:latest"
          podman push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      # All tags share one manifest digest; signing it once signs every tag.
      - name: Sign the container image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes \
            "${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Verify the signature
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cosign verify --key cosign.pub \
            "${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
