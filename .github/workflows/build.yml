name: Build asahi-atomic-niri

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
  schedule:
    - cron: "00 03 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/crispywaffles666/asahi-atomic-niri

jobs:
  build:
    name: Build aarch64 bootc image
    # Native arm64 runner avoids qemu-user emulation pitfalls with
    # post-install/kernel-install scripts during the bootc build.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: false

      - name: Sign the container image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes \
            "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes \
            "${{ env.IMAGE_NAME }}:latest"
