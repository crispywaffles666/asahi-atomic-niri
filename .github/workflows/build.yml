name: Build asahi-atomic-niri

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      benchmark_rechunk:
        description: Compare previous-build and fresh rechunk plans on the same rootfs
        type: boolean
        default: false
  schedule:
    - cron: "00 03 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # New main builds queue: never automatically cancel signing/promotion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/crispywaffles666/asahi-atomic-niri
  RAW_IMAGE: localhost/asahi-atomic-niri:raw
  CHUNKED_IMAGE: localhost/asahi-atomic-niri:chunked

jobs:
  build:
    name: Build aarch64 bootc image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # Pin cosign like upstream Universal Blue does in ublue-os/main's
      # reusable-build.yml: keep the binary current, but sign and verify with
      # the legacy simple-signing flags in publish-image.sh/verify-image.sh,
      # because containers/image, bootc, and rpm-ostree cannot read cosign 3's
      # OCI-referrer bundles. Runs 34200725326 and 34201441996 hit both halves
      # of that mismatch. bazzite-niri's v2.5.2 pin is separate: verify-only.
      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3 # Match ublue-os/main; review bumps together

      - name: Regression tests and native Distrobox platform checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check-distrobox-platforms.py

      - name: Resolve and verify build inputs
        id: inputs
        run: bash scripts/resolve-build-inputs.sh

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin \
            --authfile "$HOME/.docker/config.json"

      - name: Build pinned artifacts with selective registry caching
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          BASE_IMAGE: ${{ steps.inputs.outputs.base }}
          BREW_IMAGE: ${{ steps.inputs.outputs.brew }}
          BUILDER_IMAGE: ${{ steps.inputs.outputs.builder }}
        run: |
          cache_opts=(--cache-from "${IMAGE_NAME}-buildcache")
          if [[ $PUBLISH == true ]]; then
            cache_opts+=(--cache-to "${IMAGE_NAME}-buildcache")
          fi
          podman build --layers --target artifacts \
            "${cache_opts[@]}" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg "BREW_IMAGE=$BREW_IMAGE" \
            --build-arg "BUILDER_IMAGE=$BUILDER_IMAGE" \
            --tag localhost/asahi-artifacts:build .

      - name: Build the image locally
        env:
          BASE_IMAGE: ${{ steps.inputs.outputs.base }}
          BREW_IMAGE: ${{ steps.inputs.outputs.brew }}
          BUILDER_IMAGE: ${{ steps.inputs.outputs.builder }}
        run: |
          # Reuse local artifacts, but do not import/export final-image layers.
          # Its mutable package transactions run afresh on every CI runner.
          podman build --layers --file Containerfile \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg "BREW_IMAGE=$BREW_IMAGE" \
            --build-arg "BUILDER_IMAGE=$BUILDER_IMAGE" \
            --tag "$RAW_IMAGE" .

      - name: Rechunk and measure update size
        env:
          PREVIOUS_IMAGE: ${{ steps.inputs.outputs.previous }}
          # PRs exercise both plans; dispatch permits a controlled comparison.
          BENCHMARK_RECHUNK: ${{ github.event_name == 'pull_request' || inputs.benchmark_rechunk == true }}
        run: bash scripts/rechunk-image.sh

      - name: Lint the rechunked image
        run: podman run --rm "$CHUNKED_IMAGE" bootc container lint --fatal-warnings

      # Only a unique, unadvertised build tag moves before signature verification.
      - name: Push, sign, verify, then promote
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          FEDORA_RELEASE: ${{ steps.inputs.outputs.release }}
        run: bash scripts/publish-image.sh
