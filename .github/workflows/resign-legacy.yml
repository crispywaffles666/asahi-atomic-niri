# TEMPORARY recovery job: the image published by the PR #7 merge run was signed
# by cosign v3 in the new OCI-referrer bundle format, which the in-image
# sigstoreSigned policy (containers/image, bootc, rpm-ostree) cannot read.
# Re-sign it once with the legacy simple-signing flags that upstream Universal
# Blue uses; delete this workflow after the build consumes that signature.
name: Re-sign image (legacy recovery)
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Published digest to re-sign (sha256:...)"
        required: true

jobs:
  resign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup cosign (upstream uBlue pin)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Login to GitHub Container Registry
        run: |
          mkdir -p "$HOME/.docker"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" --password-stdin \
            --authfile "$HOME/.docker/config.json"

      - name: Re-sign with legacy simple-signing format
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          image="ghcr.io/crispywaffles666/asahi-atomic-niri@${{ inputs.digest }}"
          # The secret key must match the committed public key before use.
          cosign public-key --key env://COSIGN_PRIVATE_KEY >/tmp/derived.pub
          diff -u cosign.pub /tmp/derived.pub
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$image"
          cosign verify --new-bundle-format=false --key cosign.pub "$image"
