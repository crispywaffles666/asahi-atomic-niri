# Declare /var directories created by blueman and power-profiles-daemon so
# bootc's var-tmpfiles lint is satisfied: every directory baked into /var must
# be reproducible via `systemd-tmpfiles --boot` (these packages create the dirs
# in %post but ship no matching tmpfiles.d entry).
d /var/lib/blueman 0755 root root - -
d /var/lib/power-profiles-daemon 0755 root root - -
