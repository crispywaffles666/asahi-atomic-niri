# Each image has an Arm build, so these boxes run without emulation. Delay each
# download until use to keep the first login fast.
# Run `distrobox upgrade` by hand; uupd does not update these boxes.

[fedora]
image=docker.io/library/fedora:44
name=fedora-dev
init=true
pull=true
hostname=dev-fedora

[ubuntu]
image=docker.io/library/ubuntu:24.04
name=ubuntu-dev
init=true
pull=true
hostname=dev-ubuntu

[debian]
image=docker.io/library/debian:trixie
name=debian-dev
init=true
pull=true
hostname=dev-debian

[arch]
image=docker.io/library/archlinux:latest
name=arch-dev
init=true
pull=true
hostname=dev-arch
