# Distrobox assemble manifest: ready-made container presets for a typical
# Apple Silicon development / workstation setup.
#
# All images below are official, multi-arch OCI images that publish a
# linux/arm64 manifest, so `distrobox assemble create` runs natively on Asahi
# without emulation. They are installed on demand (no pull on create) to keep
# first login fast; `init` containers get their own systemd for full-distro use.
#
# Create them all with:
#     distrobox assemble create --file /etc/distrobox/distrobox.ini
# or one at a time, e.g.:
#     distrobox assemble create --file /etc/distrobox/distrobox.ini fedora
#
# Updating these dev containers is intentionally manual (`distrobox upgrade`),
# which is why uupd's distrobox module stays disabled in /etc/uupd/config.json.

[fedora]
image=docker.io/library/fedora:44
name=fedora-dev
init=true
pull=true
hostname=dev-fedora

[ubuntu]
image=docker.io/library/ubuntu:24.04
name=ubuntu-dev
init=true
pull=true
hostname=dev-ubuntu

[debian]
image=docker.io/library/debian:trixie
name=debian-dev
init=true
pull=true
hostname=dev-debian

[arch]
image=docker.io/library/archlinux:latest
name=arch-dev
init=true
pull=true
hostname=dev-arch
